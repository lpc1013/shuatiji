<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>刷题记 · 个人学习站</title>
<link rel="stylesheet" href="styles.css?v=20260710h">
</head>
<body>
<div id="app" class="font-m">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-row">
      <span class="brand">📚 刷题记</span>
      <select id="subjectSelect" class="subject-select" aria-label="切换学科"></select>
    </div>
  </header>

  <!-- 主内容区 -->
  <main id="view" class="view"></main>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <button class="tab" data-tab="home"><span class="ic">🏠</span><span>刷题</span></button>
    <button class="tab" data-tab="bank"><span class="ic">🔍</span><span>题库</span></button>
    <button class="tab" data-tab="wrong"><span class="ic">❌</span><span>错题</span></button>
    <button class="tab" data-tab="honor"><span class="ic">🏅</span><span>成就</span></button>
    <button class="tab" data-tab="me"><span class="ic">⚙️</span><span>我的</span></button>
  </nav>

  <!-- 题目播放器浮层 -->
  <div id="player" class="player hidden"></div>

  <!-- 通用弹层 -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>
</div>

<script src="data/data.js?v=20260729b"></script>
<script src="app.js?v=20260710p"></script>
</body>
</html>
