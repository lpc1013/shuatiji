# ============================================================
# app.ji-guang.top — Flutter Web 部署修复
# 症状：浏览器打开直接下载文件，不渲染页面
# 根因：服务器返回 Content-Type: application/octet-stream（应为 text/html）
#       通常是 nginx 未加载 mime.types 或 default_type 被改掉
# ============================================================

server {
    listen 80;
    # listen 443 ssl;      # 如果你已配 HTTPS，保留原 ssl 相关配置，不要删
    server_name app.ji-guang.top;

    # 改成你实际的前端构建产物目录（flutter build web 的输出，含 index.html / flutter_bootstrap.js）
    root /var/www/flutter_web;
    index index.html;

    # 关键修复 1：加载 MIME 映射（缺这一行是导致 .html 变 octet-stream 的常见原因）
    include /etc/nginx/mime.types;

    # 关键修复 2：兜底 MIME，防止任何未匹配文件落到 octet-stream
    default_type text/html;

    # Flutter Web（SPA）未匹配到的路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源目录保持默认 MIME 即可（JS / wasm / 图片）
    location /assets/ { }
    location /canvaskit/ { }
}

# ============================================================
# 验证与生效：
#   1) nginx -t                       # 检查语法
#   2) nginx -s reload                # 平滑重载（不中断连接）
#   3) 重新打开 https://app.ji-guang.top/ ，确认不再下载、能正常渲染
#   验证命令： curl -I https://app.ji-guang.top/  应看到  Content-Type: text/html
# ============================================================
